<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>Virtuar – AR Experience</title>
  <meta itemprop="name" content="Virtuar AR">
  <meta name="twitter:title" content="Virtuar AR">
  <meta property="og:title" content="Virtuar AR">
  <meta property="og:site_name" content="Virtuar">
  <meta name="description" content="Place 3D robots in your real world using augmented reality. Works on Chrome and Safari.">
  <meta itemprop="description" content="Place 3D robots in your real world using augmented reality.">
  <meta property="og:description" content="Place 3D robots in your real world using augmented reality. Works on Chrome and Safari.">
  <meta name="twitter:description" content="Place 3D robots in your real world using augmented reality.">
  <meta name="theme-color" content="#0A0E14">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0A0E14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    *::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
    button { -webkit-tap-highlight-color: transparent; font-family: inherit; }

    #ar-loading {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0A0E14;
      transition: opacity 0.4s ease;
    }
    #ar-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .ar-spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,107,26,0.15);
      border-top-color: #FF6B1A;
      border-radius: 50%;
      animation: ar-spin 0.8s linear infinite;
    }
    @keyframes ar-spin { to { transform: rotate(360deg); } }
    .ar-loading-label {
      margin-top: 16px;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
    }
  </style>
</head>

<body>
  <div id="ar-loading">
    <div class="ar-spinner"></div>
    <p class="ar-loading-label">Starting camera…</p>
  </div>
  <script src="bundle.js"></script>
</body>

</html>
